[flake8]
max-line-length = 88
# E203 (whitespace before ':') conflicts with black's slice formatting.
extend-ignore = E203
# ppa/legacy holds the original scripts of the physician study, and
# ppa/udagger_ppa/{_scheduler,_stochastic}.py its simulator and MIPs, moved
# unchanged apart from black formatting; they are not rewritten for flake8.
exclude =
    .git,
    __pycache__,
    ppa/legacy,
    ppa/udagger_ppa/_scheduler.py,
    ppa/udagger_ppa/_stochastic.py
