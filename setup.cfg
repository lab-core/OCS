[flake8]
max-line-length = 88
# E203 (whitespace before ':') conflicts with black's slice formatting.
extend-ignore = E203
# ppa/udagger_ppa/{_scheduler,_stochastic}.py hold the simulator and MIPs of
# the original physician study (git tag ppa), unchanged apart from black
# formatting; they are not rewritten for flake8.
exclude =
    .git,
    __pycache__,
    ppa/udagger_ppa/_scheduler.py,
    ppa/udagger_ppa/_stochastic.py
