[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ildagger"
version = "0.1.0"
description = "Imitation learning (one-shot cloning and DAgger) for online combinatorial optimisation under uncertainty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["ildagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
